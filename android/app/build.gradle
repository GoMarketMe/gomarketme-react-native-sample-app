apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

import java.util.Properties

/**
 * React Native Android configuration
 * Hermes + Nitro (New Architecture) enabled
 * Works with react-native-iap >=14.4.15
 */
react {
    // Automatically link native modules
    autolinkLibrariesWithApp()

    // ✅ Keep Hermes on
    hermesEnabled = true

    // ✅ Enable Nitro / New Architecture
    newArchEnabled = true
}

/**
 * Run Proguard on Release builds to minify Java bytecode.
 */
def enableProguardInReleaseBuilds = false

/**
 * JSC flavor (used only if Hermes is off)
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

android {
    namespace "com.reactnativesdksampleapp"

    compileSdk rootProject.ext.compileSdkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    ndkVersion rootProject.ext.ndkVersion

    defaultConfig {
        applicationId "com.reactnativesdksampleapp"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
    }

    signingConfigs {
        release {
            // Load signing info from local.properties
            def localProperties = new Properties()
            def localPropertiesFile = rootProject.file("local.properties")
            if (localPropertiesFile.exists()) {
                localPropertiesFile.withInputStream {
                    localProperties.load(it)
                }
            }

            // NOTE: Keystore lives in /android
            def keystorePath = localProperties.getProperty("storeFile") ?: "my-release-key.jks"
            storeFile file(keystorePath)
            storePassword localProperties.getProperty("storePassword")
            keyAlias localProperties.getProperty("keyAlias")
            keyPassword localProperties.getProperty("keyPassword")
        }
    }

    buildTypes {
        debug {
            // ✅ Use release key for debug builds too (enables IAPs)
            signingConfig signingConfigs.release
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }

    // ✅ Fixes Hermes + Nitro crash (classloader issue)
    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }
    }
}

dependencies {
    // React Native core runtime
    implementation("com.facebook.react:react-android")

    // ✅ Explicitly include Hermes to avoid “Unable to load Hermes” crash
    implementation("com.facebook.react:hermes-android")
}
